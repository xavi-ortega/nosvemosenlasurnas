name: Bug report
description: Report a reproducible software problem with synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include political profiles, real answers, credentials or private logs. Report security issues through the verified private route in SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction and affected version/commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser/device and enabled interface language
