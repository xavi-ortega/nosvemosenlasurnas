<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Maqueta local del test de 2023</title>
<style>
:root{color-scheme:light;--paper:#f1f5fa;--surface:#fff;--ink:#173c69;--muted:#435c78;--rule:#a9bdcf;--focus:#006b61;--selected:#e8f4f2;--error:#9e2633;font-family:'Avenir Next','Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--paper);font-size:18px;line-height:1.55}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button,select{min-height:48px}button{cursor:pointer;border:1px solid var(--ink);border-radius:8px;background:var(--surface);padding:.7rem 1.15rem;font-weight:650}button.primary{color:#fff;background:var(--ink)}button.subtle{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:4px}button:hover{filter:brightness(.97)}:focus-visible{outline:3px solid var(--focus);outline-offset:5px}button:disabled{cursor:default;opacity:.65}a{color:inherit;text-underline-offset:4px}h1,h2,h3,p{margin:0}p{max-width:63ch}h1{font-size:clamp(2.1rem,4vw,3.4rem);line-height:1.13;letter-spacing:-.025em;font-weight:750;text-wrap:balance}h2{font-size:1.45rem;line-height:1.25}h3{font-size:1.08rem}header,main,footer{width:min(100%,1040px);margin-inline:auto;padding-inline:clamp(1rem,4vw,2.6rem)}header{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;min-height:90px;border-bottom:1px solid var(--rule)}.brand{display:flex;align-items:center;gap:.7rem;font-size:1rem;font-weight:750;line-height:1.15;text-decoration:none}.edition{font-size:.85rem;text-align:right;color:var(--muted)}.skip{position:absolute;left:1rem;top:-120px;padding:1rem;background:#fff;z-index:5}.skip:focus{top:1rem}main{padding-block:clamp(1.8rem,4vw,3.6rem);min-height:70vh}.stage{max-width:820px;margin-inline:auto}.stack{display:flex;flex-direction:column;gap:1.3rem}.intro{max-width:700px;margin-inline:auto;gap:1.8rem}.intro h1{max-width:19ch;font-size:clamp(2.5rem,5vw,4rem)}.lead{font-size:1.15rem;color:var(--muted)}.quiet{color:var(--muted);font-size:.92rem}.scope{display:flex;flex-direction:column;gap:.55rem;max-width:420px}select{max-width:100%;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:.7rem}.progress{display:flex;gap:1rem;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}.track{height:5px;background:#d8e2ed;border-radius:3px;overflow:hidden}.track span{display:block;width:40%;height:100%;background:var(--ink)}.question{margin-block:.3rem .15rem}.help{border-bottom:1px solid var(--rule);padding-block:.1rem .75rem}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:650;gap:.5rem}summary::before{content:'+';font-size:1.2rem}details[open]>summary::before{content:'−'}details p{padding-top:.35rem;color:var(--muted)}fieldset{min-width:0;border:0;padding:0;margin:0}legend{font-weight:650;margin-bottom:.7rem}.answers{display:flex;flex-direction:column;gap:.55rem}.choice{display:flex;align-items:center;gap:.9rem;min-height:62px;padding:.8rem 1rem;border:1px solid var(--rule);border-radius:8px;background:#fff;cursor:pointer;font-size:1rem;font-weight:550}.choice input{width:22px;height:22px;margin:0;accent-color:var(--focus);flex-shrink:0}.choice:has(input:checked){background:var(--selected);border:2px solid var(--focus);padding:calc(.8rem - 1px) calc(1rem - 1px)}.choice:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:3px}.other-answers{display:flex;gap:.8rem;margin-top:.5rem;flex-wrap:wrap}.other-answers .choice{flex:1 1 240px;background:transparent;min-height:52px;font-size:.92rem}.other-answers .choice:has(input:checked){background:var(--selected)}.actions{display:flex;gap:.8rem;justify-content:space-between;flex-wrap:wrap;align-items:center}.actions .primary{min-width:180px}.error{color:var(--error);font-weight:650}.error:empty{display:none}.checkpoint{max-width:640px;padding-block:2rem;gap:1.7rem}.checkpoint .actions{justify-content:flex-start}.text-links{display:flex;gap:1rem;flex-wrap:wrap}.result-intro{max-width:700px}.result-list{display:flex;flex-direction:column;gap:1.7rem}.result{border-top:2px solid var(--rule);padding-top:1.2rem}.result-heading{display:flex;gap:1rem;align-items:baseline;justify-content:space-between;flex-wrap:wrap}.index{font-size:1.4rem;font-weight:750;white-space:nowrap}.relation{border-left:4px solid var(--ink);padding-left:1rem;margin-block:1rem}.relation p{margin-top:.4rem}.status{max-width:650px;margin-inline:auto;padding-block:3rem;gap:1.5rem}.notice{border-left:3px solid var(--rule);padding-left:1rem;font-size:.9rem}.loading-mark{width:48px;height:6px;background:var(--ink)}footer{padding-block:1.6rem;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;font-size:.85rem;color:var(--muted)}.prototype-controls{max-width:1040px;margin:1rem auto 2rem;padding-inline:clamp(1rem,4vw,2.6rem);display:flex;flex-wrap:wrap;gap:.5rem}.prototype-controls button{font-size:.8rem;min-height:44px;padding:.45rem .7rem}.prototype-label{width:100%;font-size:.83rem;color:var(--muted)}.state-enter{animation:state-enter 180ms ease-out}@keyframes state-enter{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:560px){:root{font-size:17px}header{min-height:80px;padding-block:.7rem;align-items:flex-start}.brand svg{width:28px;height:28px}.edition{max-width:13ch;font-size:.78rem}main{padding-block:1.6rem}.stack{gap:1.1rem}.choice{min-height:60px;padding:.75rem}.actions .primary{flex:1}.other-answers{gap:.55rem}.other-answers .choice{flex-basis:100%}.checkpoint{padding-block:1rem}.checkpoint .actions{flex-direction:column;align-items:stretch}.result-heading{align-items:flex-start}.text-links{gap:.5rem}.intro h1{max-width:17ch}.status{padding-block:1.5rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#content">Saltar al contenido</a>
<header><a class="brand" href="#" id="home"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 32 32"><path d="M4 12h24v16H4zM9 4h14v12H9z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m12 9 3 3 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Nos Vemos<br>en las Urnas</span></a><p class="edition">Congreso<br>23 de julio de 2023<br>Maqueta ficticia</p></header>
<main id="content" tabindex="-1"></main>
<footer><span>Gratis y sin cuenta.</span><span>Respuestas en tu navegador.</span><a href="#prototype-controls">Ver estados de la maqueta</a></footer>
<nav class="prototype-controls" id="prototype-controls" aria-label="Estados de la maqueta local"><p class="prototype-label">Maqueta local de diseño. Propuesta y resultados ficticios de prueba; todavía no es el test con programas reales.</p></nav>
<script>
const content = document.getElementById('content');
const controls = document.getElementById('prototype-controls');
const labels = {intro:'Inicio',scope:'Provincia',question:'Pregunta',help:'Ayuda abierta',selected:'Respuesta elegida',validation:'Falta una respuesta',checkpoint:'Diez preguntas',results:'Resultados de prueba',missing:'Sin evidencia',loading:'Cargando',error:'Error de carga'};
const answers = [['-2','Muy en desacuerdo'],['-1','En desacuerdo'],['0','Ni de acuerdo ni en desacuerdo'],['1','De acuerdo'],['2','Muy de acuerdo']];
let chosen = null;
let state = 'intro';
const action = (name, label, primary = false) => `<button type="button" data-action="${name}" class="${primary ? 'primary' : ''}">${label}</button>`;
function render(next) {
 state = next;
 let markup = '';
 if (state === 'intro' || state === 'scope') {
  markup = `<section class="stage stack intro"><h1>¿Qué propuestas coinciden con tus ideas?</h1><p class="lead">Empieza con diez preguntas. Tú eliges si terminas o respondes cinco más.</p><p>Explora propuestas de las elecciones al Congreso de 2023. Verás coincidencias, diferencias y la información que falta.</p>${state === 'scope' ? '<label class="scope">¿En qué provincia votabas?<select aria-label="Provincia"><option>Selecciona tu provincia</option><option>Madrid</option><option>Palencia</option><option>Almería</option></select></label>' : ''}<div class="actions">${action(state === 'intro' ? 'scope' : 'question',state === 'intro' ? 'Empezar el test' : 'Empezar las diez preguntas',true)}</div><p class="quiet">Tus respuestas se quedan en esta página. Si la recargas o cierras, se borran. No verás resultados hasta que decidas terminar.</p></section>`;
 } else if (['question','help','selected','validation'].includes(state)) {
  if(state === 'selected') chosen = '-1';
  if(state === 'validation') chosen = null;
  markup = `<section class="stage stack"><div class="progress"><span>Pregunta 4 de 10</span><span>Vivienda</span></div><div class="track" aria-hidden="true"><span></span></div><h1 class="question">Limitar los alquileres en zonas de alta demanda.</h1><details class="help" ${state === 'help' ? 'open' : ''}><summary>¿Qué significa esta propuesta?</summary><p>La propuesta plantea poner un límite al precio del alquiler en zonas donde hay mucha demanda de vivienda. Puedes responder si estás de acuerdo con esa medida, sin predecir qué efectos tendría.</p></details><fieldset><legend>¿Qué opinas de esta propuesta?</legend><div class="answers">${answers.map(([value,label]) => `<label class="choice"><input type="radio" name="answer" value="${value}" ${chosen === value ? 'checked' : ''}><span>${label}</span></label>`).join('')}</div><div class="other-answers">${[['unsure','No lo tengo claro'],['skip','Prefiero no responder']].map(([value,label]) => `<label class="choice"><input type="radio" name="answer" value="${value}" ${chosen === value ? 'checked' : ''}><span>${label}</span></label>`).join('')}</div></fieldset><p class="error" role="alert">${state === 'validation' ? 'Elige una opción para continuar. También puedes no responder.' : ''}</p><div class="actions">${action('back','Volver')}${action('next','Continuar',true)}</div></section>`;
 } else if(state === 'checkpoint') {
  markup = `<section class="stage stack checkpoint"><p class="quiet">Has respondido diez preguntas</p><h1>Tú decides cómo seguir.</h1><p class="lead">Puedes ver tus resultados ahora o explorar cinco preguntas más.</p><p>Más respuestas pueden aumentar o reducir las coincidencias. Los resultados siguen ocultos.</p><div class="actions">${action('results','Terminar y ver resultados',true)}${action('question','Responder cinco más')}</div><div class="text-links">${action('question','Revisar respuestas')}${action('intro','Borrar respuestas')}</div></section>`;
 } else if(state === 'results' || state === 'missing') {
  const missing = state === 'missing';
  markup = `<section class="stage stack"><div class="result-intro stack"><h1>Tus coincidencias, con contexto.</h1><p>${missing ? 'No hay suficiente evidencia común para ordenar estas candidaturas. Puedes consultar lo que sabemos de cada una.' : 'Estas candidaturas de prueba se han comparado con las mismas ocho propuestas y los mismos pesos.'}</p><p class="quiet">El porcentaje resume coincidencias con propuestas. No es una probabilidad ni una recomendación de voto.</p></div><div class="result-list"><article class="result stack"><div class="result-heading"><h2>Candidatura ficticia Alba</h2><span class="index">${missing ? 'Sin clasificación' : '75 % de coincidencia'}</span></div><p>Puede haber diferencias en una propuesta aunque el resultado total sea alto.</p><details open><summary>Coincidencias y diferencias</summary><div class="relation"><h3>Diferencia: limitar los alquileres</h3><p><strong>Tu respuesta:</strong> Muy en desacuerdo.</p><p><strong>El programa ficticio:</strong> apoya limitar los alquileres.</p><p>Tu respuesta y esta propuesta van en sentidos contrarios.</p><details><summary>Leer la cita de prueba</summary><p>Documento ficticio interno. La versión real mostrará aquí su cita original, página y contexto.</p></details></div></details></article><article class="result stack"><h2>Candidatura ficticia sin programa</h2><p>No hemos incorporado un programa aplicable. Esta candidatura sigue visible y no se puntúa.</p></article></div><div class="actions">${action('question','Revisar respuestas')}${action('intro','Borrar respuestas')}</div><p class="notice">Estos datos son ficticios y se usan únicamente para revisar la maqueta.</p></section>`;
 } else {
  markup = `<section class="status stack">${state === 'loading' ? '<div class="loading-mark" aria-hidden="true"></div><h1>Cargando la edición de 2023…</h1><p role="status">Estamos preparando las preguntas. Todavía no tienes que responder.</p>' : '<h1>No hemos podido cargar las preguntas.</h1><p role="alert">Puedes volver a intentarlo. La edición de 2023 sigue en preparación.</p><div class="actions">'+action('intro','Volver a intentar',true)+'</div>'}</section>`;
 }
 content.innerHTML = markup;
 content.firstElementChild.classList.add('state-enter');
 for(const control of controls.querySelectorAll('button')) control.setAttribute('aria-pressed',String(control.dataset.state === state));
 const heading = content.querySelector('h1'); heading.setAttribute('tabindex','-1'); heading.focus({preventScroll:true});
}
for(const [name,label] of Object.entries(labels)) {const button = document.createElement('button');button.type='button';button.textContent=label;button.dataset.state=name;button.addEventListener('click',()=>render(name));controls.append(button);}
content.addEventListener('change',event=>{if(event.target instanceof HTMLInputElement && event.target.name === 'answer') chosen = event.target.value;});
content.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const next=target.dataset.action;if(next==='next'){if(chosen===null){render('validation');return;}render('checkpoint');}else if(next==='back'){render('scope');}else{if(next==='intro')chosen=null;render(next);}});
document.getElementById('home').addEventListener('click',event=>{event.preventDefault();render('intro');});
render('intro');
</script>
</body>
</html>
